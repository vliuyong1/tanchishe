<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #22c55e;
    --food: #ef4444;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  h1 { margin: 0; font-size: 24px; letter-spacing: 4px; }
  .hud {
    display: flex;
    gap: 32px;
    font-size: 15px;
    color: var(--muted);
  }
  .hud b { color: var(--accent); font-size: 18px; }
  .board {
    position: relative;
    background: var(--panel);
    border: 2px solid #334155;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  canvas { display: block; border-radius: 6px; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, .82);
    border-radius: 6px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 28px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  button {
    padding: 10px 28px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #052e16;
    font-weight: 700;
    cursor: pointer;
    transition: transform .1s;
  }
  button:hover { transform: translateY(-2px); }
  .hint { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高 <b id="best">0</b></span>
    <span>速度 <b id="level">1</b></span>
  </div>
  <div class="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">贪吃蛇</h2>
      <p id="msg">方向键 / WASD 控制移动<br>空格暂停 · 吃到食物得分</p>
      <button id="btn">开始游戏</button>
    </div>
  </div>
  <div class="hint">方向键 或 W A S D 移动 · 空格 暂停/继续</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btn');

  const COLS = 24, ROWS = 24, CELL = canvas.width / COLS;
  const BASE_TICK = 130;

  let snake, dir, nextDir, food, score, best, tick, timer, state; // state: idle|running|paused|over

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    tick = BASE_TICK;
    placeFood();
    updateHud();
  }

  function placeFood() {
    const free = [];
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
    food = free[Math.floor(Math.random() * free.length)];
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = Math.floor((BASE_TICK - tick) / 10) + 1;
    bestEl.textContent = best;
  }

  function start() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
    loop();
  }

  function loop() {
    clearTimeout(timer);
    if (state !== 'running') return;
    step();
    draw();
    if (state === 'running') timer = setTimeout(loop, tick);
  }

  function step() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      if (score > best) { best = score; localStorage.setItem('snake-best', best); }
      if (tick > 50) tick -= 3;
      placeFood();
      updateHud();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    titleEl.textContent = '游戏结束';
    msgEl.innerHTML = `本局得分 <b style="color:#22c55e">${score}</b> · 最高 ${best}`;
    btn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = 'rgba(148,163,184,.07)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // food
    const pad = CELL * 0.18;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - pad, 0, Math.PI * 2);
    ctx.fill();

    // snake
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgb(${Math.round(34 + t * 20)}, ${Math.round(197 - t * 60)}, ${Math.round(94 - t * 20)})`;
      const p = i === 0 ? CELL * 0.06 : CELL * 0.12;
      roundRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2, 5);
    });

    // eyes on head
    const h = snake[0];
    ctx.fillStyle = '#052e16';
    const ex = h.x * CELL + CELL / 2 + dir.x * CELL * 0.18;
    const ey = h.y * CELL + CELL / 2 + dir.y * CELL * 0.18;
    const off = CELL * 0.16;
    ctx.beginPath();
    ctx.arc(ex - dir.y * off, ey - dir.x * off, CELL * 0.08, 0, Math.PI * 2);
    ctx.arc(ex + dir.y * off, ey + dir.x * off, CELL * 0.08, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      clearTimeout(timer);
      titleEl.textContent = '已暂停';
      msgEl.innerHTML = '按空格或点击按钮继续';
      btn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      overlay.classList.add('hidden');
      loop();
    }
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    const map = {
      arrowup: [0, -1], w: [0, -1],
      arrowdown: [0, 1], s: [0, 1],
      arrowleft: [-1, 0], a: [-1, 0],
      arrowright: [1, 0], d: [1, 0]
    };
    if (map[k]) {
      e.preventDefault();
      const [x, y] = map[k];
      if (x === -dir.x && y === -dir.y) return; // no reverse
      nextDir = {x, y};
    } else if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'idle' || state === 'over') start();
      else togglePause();
    }
  });

  btn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  reset();
  state = 'idle';
  draw();
})();
</script>
</body>
</html>
